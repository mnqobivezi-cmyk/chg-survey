<!DOCTYPE html>
<html lang="en">

<title>CHG North Cell Group</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#080d1a;--white:#f0f6ff;--muted:#7a9ab8;
  --card:rgba(10,15,30,0.80);--radius:20px;
  --acc:#00d4ff;
  --btn1:#007a8a;--btn2:#00d4ff;
}
html,body{height:100%;width:100%;overflow:hidden}
body{background:var(--navy);font-family:'Segoe UI',system-ui,sans-serif;color:var(--white)}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.25;animation:drift 14s ease-in-out infinite}
.orb1{width:420px;height:420px;background:radial-gradient(circle,#002a40,transparent);top:-120px;left:-120px}
.orb2{width:360px;height:360px;background:radial-gradient(circle,#0d0028,transparent);bottom:-80px;right:-80px;animation-delay:-7s}
.orb3{width:220px;height:220px;background:radial-gradient(circle,rgba(0,180,220,.08),transparent);top:35%;left:45%;animation-delay:-3.5s}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(28px,18px) scale(1.08)}}
#app{position:relative;z-index:1;width:100%;height:100dvh;display:flex;align-items:center;justify-content:center}
.screen{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;overflow-y:auto}

.card{background:var(--card);border:1px solid rgba(255,255,255,0.07);border-top:2px solid var(--acc);border-radius:var(--radius);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:28px 24px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,0.04);transition:border-top-color .6s}

/* Only animate when moving between questions */
@keyframes slideF{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideB{from{opacity:0;transform:translateX(-32px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeU{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.slide-f{animation:slideF .36s cubic-bezier(.4,0,.2,1)}
.slide-b{animation:slideB .36s cubic-bezier(.4,0,.2,1)}
.fade-u{animation:fadeU .32s cubic-bezier(.4,0,.2,1)}

/* Progress — gradient */
.progress-wrap{width:100%;margin-bottom:18px}
.progress-track{width:100%;height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.progress-fill{height:100%;border-radius:2px;transition:width .55s cubic-bezier(.4,0,.2,1)}
.progress-label{font-size:11px;color:var(--muted);text-align:right;margin-top:5px;letter-spacing:.5px}

h1{font-size:24px;font-weight:700;line-height:1.2;margin-bottom:8px;background:linear-gradient(135deg,var(--white) 40%,#88eeff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
h2{font-size:17px;font-weight:600;line-height:1.45;margin-bottom:6px;color:var(--white)}
.subtitle{font-size:13px;color:var(--muted);line-height:1.65;margin-bottom:16px}
.q-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--acc);margin-bottom:7px;opacity:.85;transition:color .6s}

/* All primary buttons same gradient + shadow */
.btn-primary{
  width:100%;padding:15px;border-radius:14px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--btn1),var(--btn2));
  color:#040d18;font-weight:700;font-size:15px;letter-spacing:.3px;
  box-shadow:0 4px 18px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.1) inset;
  transition:transform .15s,opacity .2s;margin-top:8px;
}
.btn-primary:active{transform:scale(.97)}
.btn-primary:disabled{opacity:.32;cursor:not-allowed}
.btn-secondary{width:100%;padding:13px;border-radius:14px;border:1px solid rgba(255,255,255,.1);cursor:pointer;background:transparent;color:var(--muted);font-size:14px;transition:all .15s;margin-top:8px}
.btn-secondary:active{background:rgba(255,255,255,.05);color:var(--white)}
.nav-row{display:flex;gap:10px;margin-top:8px}
.nav-row .btn-secondary{flex:1;margin-top:0}
.nav-row .btn-primary{flex:2;margin-top:0}

/* Options — NO transition animation on select, just colour */
.options{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
.opt{padding:13px 16px;border-radius:13px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.03);cursor:pointer;font-size:14px;color:var(--white);text-align:left;display:flex;align-items:center;gap:12px;width:100%}
.opt.selected{border-color:var(--sel-border);background:var(--sel-bg)}
.opt-ring{width:19px;height:19px;border-radius:50%;border:1.5px solid currentColor;flex-shrink:0;display:flex;align-items:center;justify-content:center}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:9px 15px;border-radius:30px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);cursor:pointer;font-size:13px;color:var(--muted)}
.chip.selected{border-color:var(--sel-border);background:var(--sel-bg);color:var(--white)}

/* Rating cards — NO animation on select */
.rating-cards{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.rating-card{border:1px solid rgba(255,255,255,.09);border-radius:13px;padding:12px 15px;background:rgba(255,255,255,.03);cursor:pointer;display:flex;align-items:center;gap:12px;width:100%}
.rating-card.selected{border-color:var(--sel-border);background:var(--sel-bg)}
.rating-icon{width:32px;height:32px;border-radius:9px;border:1.5px solid rgba(255,255,255,.12);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.rating-card.selected .rating-icon{border-color:var(--sel-border);color:var(--sel-border)}
.rating-label{font-size:13px;font-weight:600;color:var(--white);text-align:left;line-height:1.3}

/* Wheel */
.wheel-wrap{width:100%;position:relative;height:192px;margin-bottom:14px;cursor:grab;user-select:none;overflow:hidden}
.wheel-wrap:active{cursor:grabbing}
.wheel-fade-top,.wheel-fade-bot{position:absolute;left:0;right:0;height:70px;z-index:2;pointer-events:none}
.wheel-fade-top{top:0;background:linear-gradient(to bottom,#080d1a 10%,transparent)}
.wheel-fade-bot{bottom:0;background:linear-gradient(to top,#080d1a 10%,transparent)}
.wheel-center-box{position:absolute;left:10px;right:10px;top:50%;transform:translateY(-50%);height:48px;border-radius:13px;border:1.5px solid var(--acc);background:rgba(255,255,255,.05);z-index:1;pointer-events:none;transition:border-color .6s}
.wheel-inner{display:flex;flex-direction:column;align-items:center;will-change:transform}
.wheel-item{height:48px;display:flex;align-items:center;justify-content:center;font-size:14px;color:rgba(255,255,255,.28);width:100%;text-align:center;padding:0 16px;cursor:pointer}
.wheel-item.active{color:var(--white);font-weight:600;font-size:16px}

textarea,input[type=text],input[type=tel],input[type=password]{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:13px 15px;color:var(--white);font-size:14px;font-family:inherit;resize:none;outline:none;transition:border-color .2s;margin-bottom:10px}
textarea:focus,input:focus{border-color:var(--acc)}
textarea::placeholder,input::placeholder{color:var(--muted)}

.alert{background:rgba(255,200,100,.06);border:1px solid rgba(255,200,100,.25);border-radius:13px;padding:13px 16px;margin-bottom:13px;font-size:13px;line-height:1.65;color:#ffd580}
.alert strong{display:block;margin-bottom:4px;font-size:14px}
.alert-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.alert-btn{padding:8px 13px;border-radius:10px;border:1px solid rgba(255,200,100,.3);background:transparent;color:#ffd580;font-size:12px;cursor:pointer}
.alert-btn.confirm{background:rgba(255,200,100,.1)}

.identity-form label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;margin-top:8px}
.identity-form label:first-child{margin-top:0}

.logo-wrap{width:70px;height:70px;border-radius:50%;overflow:hidden;margin:0 auto 16px;border:1.5px solid rgba(255,255,255,.15);box-shadow:0 4px 20px rgba(0,0,0,.5)}
.logo-wrap img{width:100%;height:100%;object-fit:cover}
.divider{width:38px;height:1.5px;background:linear-gradient(90deg,transparent,var(--acc),transparent);margin:13px auto;transition:background .6s}

.id-choice{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.id-card{border:1px solid rgba(255,255,255,.09);border-radius:15px;padding:16px 18px;background:rgba(255,255,255,.03);cursor:pointer;text-align:left}
.id-card.selected{border-color:var(--sel-border);background:var(--sel-bg)}
.id-card-title{font-size:14px;font-weight:600;color:var(--white);margin-bottom:3px}
.id-card-sub{font-size:13px;color:var(--muted)}

.err{color:#ffaaaa;font-size:13px;margin-bottom:8px;padding:10px 14px;background:rgba(255,80,80,.07);border-radius:10px;border:1px solid rgba(255,80,80,.18);line-height:1.5}
.hidden{display:none!important}

/* Admin */
.admin-wrap{position:relative;z-index:1;width:100%;max-width:900px;height:100dvh;overflow-y:auto;padding:24px 20px}
.admin-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.07)}
.admin-title{font-size:18px;font-weight:700;color:var(--white)}
.admin-sub{font-size:12px;color:var(--muted);margin-top:2px}
.logout-btn{padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--muted);font-size:13px;cursor:pointer}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:14px;text-align:center}
.stat-num{font-size:26px;font-weight:700;color:var(--acc)}
.stat-label{font-size:12px;color:var(--muted);margin-top:3px}
.insights-btn{width:100%;padding:14px;border-radius:13px;border:1.5px solid var(--acc);background:rgba(0,180,220,.07);color:var(--acc);font-size:14px;font-weight:600;cursor:pointer;margin-bottom:16px;letter-spacing:.3px}
.insights-btn:disabled{opacity:.4;cursor:not-allowed}
.insights-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:18px;margin-bottom:16px}
.insights-card h3{font-size:10px;font-weight:600;color:var(--acc);margin-bottom:10px;letter-spacing:1px;text-transform:uppercase}
.insights-body{font-size:14px;color:var(--white);line-height:1.85;white-space:pre-wrap}
.sub-list{display:flex;flex-direction:column;gap:8px}
.sub-item{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:13px;overflow:hidden;cursor:pointer}
.sub-item:hover{border-color:rgba(0,212,255,.25)}
.sub-header{padding:13px 15px;display:flex;align-items:center;justify-content:space-between}
.sub-name{font-size:14px;font-weight:600;color:var(--white)}
.sub-meta{font-size:12px;color:var(--muted);margin-top:2px}
.sub-badge{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.1);color:var(--muted)}
.sub-detail{padding:12px 15px 15px;border-top:1px solid rgba(255,255,255,.06)}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:4px}
.detail-block{background:rgba(255,255,255,.03);border-radius:9px;padding:9px 11px}
.detail-block.full{grid-column:1/-1}
.detail-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px}
.detail-val{font-size:13px;color:var(--white);line-height:1.5}
.chevron{transition:transform .25s;display:inline-block}
.chevron.open{transform:rotate(180deg)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:2px}
</style>

function vib(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

function h(tag, attrs, ...ch){
  const el = document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(k==='class') el.className=v;
    else if(k==='style') el.style.cssText=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v);
  }
  for(const c of ch.flat()) if(c!=null&&c!==false)
    el.appendChild(typeof c==='string' ? document.createTextNode(c) : c);
  return el;
}

// ── WHEEL ─────────────────────────────────────────────────────────────────
const IH=48;
function makeWheel(items, value, onChange){
  let idx=Math.max(0,items.indexOf(value));
  let drag=false,sy=null,si=0;
  const wrap=h('div',{'class':'wheel-wrap'});
  wrap.appendChild(h('div',{'class':'wheel-fade-top'}));
  wrap.appendChild(h('div',{'class':'wheel-center-box'}));
  wrap.appendChild(h('div',{'class':'wheel-fade-bot'}));
  const inn=h('div',{'class':'wheel-inner'});
  wrap.appendChild(inn);

  function upd(anim=true){
    const offset=(192/2)-(IH/2)-idx*IH;
    inn.style.transition=anim?'transform .24s cubic-bezier(.4,0,.2,1)':'none';
    inn.style.transform=`translateY(${offset}px)`;
    inn.querySelectorAll('.wheel-item').forEach((el,i)=>{
      el.className='wheel-item'+(i===idx?' active':'');
    });
  }
  items.forEach((item,i)=>{
    const el=h('div',{'class':'wheel-item'+(i===idx?' active':'')},item);
    el.addEventListener('click',()=>{ if(i===idx)return; idx=i; upd(); onChange(items[idx]); vib(22); });
    inn.appendChild(el);
  });
  requestAnimationFrame(()=>upd(false));

  function clamp(n){return Math.max(0,Math.min(items.length-1,n));}
  wrap.addEventListener('mousedown',e=>{e.preventDefault();drag=true;sy=e.clientY;si=idx;});
  window.addEventListener('mousemove',e=>{
    if(!drag)return; e.preventDefault();
    const ni=clamp(si+Math.round((sy-e.clientY)/IH));
    if(ni!==idx){idx=ni;upd();onChange(items[idx]);vib(16);}
  });
  window.addEventListener('mouseup',()=>{drag=false;});
  wrap.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;si=idx;drag=true;},{passive:true});
  wrap.addEventListener('touchmove',e=>{
    if(!drag)return; e.preventDefault();
    const ni=clamp(si+Math.round((sy-e.touches[0].clientY)/IH));
    if(ni!==idx){idx=ni;upd();onChange(items[idx]);vib(16);}
  },{passive:false});
  wrap.addEventListener('touchend',()=>{drag=false;});
  return wrap;
}

function doKeepAnon(){ S.conflictAlert=false; applyConflict(); render(); }
function applyConflict(){
  if(S.conflictSrc.startsWith('q4_')){
    const v=S.conflictSrc.replace('q4_','');
    if(!S.q4.includes(v)) S.q4.push(v); else S.q4=S.q4.filter(x=>x!==v);
  }
  if(S.conflictSrc.startsWith('q6_')) S.q6=S.conflictSrc.replace('q6_','');
}
function checkConflict(src,val){
  if(S.identity!=='anon') return false;
  if(src==='q4'&&['Hosting','Sharing the word','Worship','Teaching','Outreach activities'].includes(val)&&!S.q4.includes(val)) return true;
  if(src==='q6'&&['Yes','Occasionally'].includes(val)) return true;
  return false;
}

// ── SUBMIT via Netlify function ───────────────────────────────────────────
async function submitForm(){
  S.submitting=true; S.submitError=''; render();
  const payload = {
    identity_type:    S.identity,
    respondent_name:  S.identity==='named' ? (S.name||null) : null,
    respondent_phone: S.identity==='named' ? (S.phone||null): null,
    q1_presabbath:    S.q1,
    q1_improvement:   S.q1improve  || null,
    q2a_physical:     S.q2a,
    q2b_frequency:    S.q2a!=='No' ? S.q2b : null,
    q3_structure:     S.q3,
    q3_text:          S.q3text    || null,
    q4_participation: S.q4,
    q4_other:         S.q4other   || null,
    q5_ideas:         S.q5,
    q5_custom:        S.q5custom  || null,
    q6_pastoral:      S.q6,
    q6_support_note:  S.q6support || null,
    q7_reflection:    S.q7        || null,
    submitted_at:     new Date().toISOString(),
    device:           /mobile|android|iphone|ipad/i.test(navigator.userAgent)?'mobile':'desktop'
  };
  try {
    const res = await fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    S.submitting = false;
    if(res.ok){
      vib([50,30,50]); goTo(10,'forward');
    } else {
      const t = await res.text().catch(()=>'');
      S.submitError = 'Error ' + res.status + ': ' + t;
      render();
    }
  } catch(e){
    S.submitting = false;
    S.submitError = 'Error: ' + e.message;
    render();
  }
}

// ── SCREEN WRAPPER ────────────────────────────────────────────────────────
function wrap(content, step){
  const tq=7, qs=step-2;
  const pct = step<=1?0 : step>=10?100 : Math.round((qs/tq)*100);
  const col  = (step>=2&&step<=8) ? QCOL[step-2] : '#7ecfdc';
  const ac   = S.dir==='forward' ? 'slide-f' : 'slide-b';
  const kids = [];
  if(step>=2 && step<10){
    kids.push(h('div',{'class':'progress-wrap'},
      h('div',{'class':'progress-track'},
        h('div',{'class':'progress-fill','style':`width:${pct}%;background:linear-gradient(90deg,rgba(0,120,140,.7),${col})`})
      ),
      h('div',{'class':'progress-label'}, qs + ' of ' + tq)
    ));
  }
  kids.push(h('div',{'class':'card '+ac}, ...content));
  return h('div',{'class':'screen'}, ...kids);
}

// ── LOAD RESPONSES ────────────────────────────────────────────────────────
function loadResp(){
  S.loadingResp=true;
  const xhr=new XMLHttpRequest();
  xhr.open('GET', SB_URL+'/rest/v1/cell_group_responses?select=*&order=submitted_at.desc', true);
  xhr.setRequestHeader('apikey', SB_KEY);
  xhr.setRequestHeader('Authorization','Bearer '+SB_KEY);
  xhr.onreadystatechange=function(){
    if(xhr.readyState!==4)return;
    try{ S.responses=JSON.parse(xhr.responseText); }catch(e){ S.responses=[]; }
    S.loadingResp=false; render();
  };
  xhr.onerror=function(){ S.responses=[]; S.loadingResp=false; render(); };
  xhr.send();
}

// ── AI INSIGHTS ───────────────────────────────────────────────────────────
function genInsights(){
  if(!S.responses.length)return;
  S.loadingInsights=true; S.insights=''; render();
  const sum=S.responses.map((r,i)=>`
Response ${i+1} [${r.identity_type==='named'?r.respondent_name:'Anonymous'}]:
- Pre Sabbath feeling: ${r.q1_presabbath}${r.q1_improvement?`, improvement: "${r.q1_improvement}"`:''}
- Physical gatherings: ${r.q2a_physical}${r.q2b_frequency&&r.q2a_physical!=='No'?`, frequency: ${r.q2b_frequency}`:''}
- Connection & support: ${r.q3_structure}${r.q3_text?`, note: "${r.q3_text}"`:''}
- Participation: ${(r.q4_participation||[]).join(', ')||'none'}${r.q4_other?`, other: "${r.q4_other}"`:''}
- Activity ideas: ${[...(r.q5_ideas||[]),r.q5_custom].filter(Boolean).join(', ')||'none'}
- Pastoral support: ${r.q6_pastoral}${r.q6_support_note?`, note: "${r.q6_support_note}"`:''}
- Final reflection: ${r.q7_reflection||'none'}
`).join('\n---\n');
  const xhr=new XMLHttpRequest();
  xhr.open('POST','https://api.anthropic.com/v1/messages',true);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.onreadystatechange=function(){
    if(xhr.readyState!==4)return;
    try{
      const d=JSON.parse(xhr.responseText);
      S.insights=d.content?.find(b=>b.type==='text')?.text||'No insights returned.';
    }catch(e){ S.insights='Unable to parse response.'; }
    S.loadingInsights=false; render();
  };
  xhr.onerror=function(){ S.insights='Unable to generate insights. Please try again.'; S.loadingInsights=false; render(); };
  xhr.send(JSON.stringify({
    model:'claude-sonnet-4-20250514', max_tokens:1000,
    system:'You are an insightful community analyst for the Church of the Holy Ghost, North Cell Group. Analyse the survey responses and return a structured, warm, and actionable report. Use clear sections with headings. Do not use emojis. Write in a professional but pastoral tone. Cover: overall sentiment, key themes, connection and support needs, participation interests, leadership recommendations, and notable reflections from open-text responses.',
    messages:[{role:'user',content:`Here are ${S.responses.length} survey responses:\n\n${sum}\n\nPlease provide a structured insights report.`}]
  }));
}

      if(r.q3_text) blocks.push(h('div',{'class':'detail-block full'},h('div',{'class':'detail-label'},'Connection Note'),h('div',{'class':'detail-val'},r.q3_text)));
      if(r.q6_support_note) blocks.push(h('div',{'class':'detail-block full'},h('div',{'class':'detail-label'},'Support Note'),h('div',{'class':'detail-val'},r.q6_support_note)));
      if(r.q7_reflection) blocks.push(h('div',{'class':'detail-block full'},h('div',{'class':'detail-label'},'Final Reflection'),h('div',{'class':'detail-val'},r.q7_reflection)));
      const det=h('div',{'class':'sub-detail hidden'},h('div',{'class':'detail-grid'},...blocks));
      if(r.respondent_phone){ const ph=h('div',{'style':'margin-bottom:8px;font-size:13px;color:var(--muted)'},'Contact: ',h('span',{'style':'color:var(--white)'},r.respondent_phone)); det.insertBefore(ph,det.firstChild); }
      const chev=svgChev(false);
      const hdr=h('div',{'class':'sub-header'},
        h('div',{},
          h('div',{'class':'sub-name'},r.identity_type==='named'&&r.respondent_name?r.respondent_name:'Anonymous'),
          h('div',{'class':'sub-meta'},date+' at '+time+' · '+(r.device||'unknown'))
        ),
        h('div',{'style':'display:flex;align-items:center;gap:10px'},
          h('span',{'class':'sub-badge'},r.identity_type==='named'?'Named':'Anon'),
          chev
        )
      );
      hdr.addEventListener('click',()=>{
        open=!open;
        det.className=open?'sub-detail fade-u':'sub-detail hidden';
        chev.className='chevron'+(open?' open':'');
      });
      list.appendChild(h('div',{'class':'sub-item'},hdr,det));
    });
    kids.push(list);
  }
  return h('div',{'class':'admin-wrap'},...kids);
}

render();
</script>
</body>
</html>
