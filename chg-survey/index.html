/* ---------- wheel widget ---------- */
function makeWheel(items,value,onChange,itemH){
  const IH=itemH||48, HGT=itemH?150:192;
  let idx=Math.max(0,items.indexOf(value));
  let drag=false,sy=null,si=0;
  const wrap=h('div',{'class':'wheel-wrap','style':`height:${HGT}px`});
  wrap.appendChild(h('div',{'class':'wheel-fade-top'}));
  wrap.appendChild(h('div',{'class':'wheel-center-box','style':`height:${IH}px`}));
  wrap.appendChild(h('div',{'class':'wheel-fade-bot'}));
  const inn=h('div',{'class':'wheel-inner'});
  wrap.appendChild(inn);
  function upd(anim){
    const offset=(HGT/2)-(IH/2)-idx*IH;
    inn.style.transition=anim?'transform .18s cubic-bezier(.4,0,.2,1)':'none';
    inn.style.transform=`translateY(${offset}px)`;
    inn.querySelectorAll('.wheel-item').forEach((el,i)=>{el.className='wheel-item'+(i===idx?' active':'');});
  }
  items.forEach((item,i)=>{
    const el=h('div',{'class':'wheel-item'+(i===idx?' active':''),'style':`height:${IH}px`},String(item));
    el.addEventListener('click',()=>{if(i===idx)return;idx=i;upd(false);onChange(items[idx]);vib(22);});
    inn.appendChild(el);
  });
  requestAnimationFrame(()=>{
    upd(false);
    setTimeout(()=>{
      if(drag)return;
      const hi=Math.min(idx+1,items.length-1);
      const lo=Math.max(idx-1,0);
      inn.style.transition='transform .4s cubic-bezier(.4,0,.2,1)';
      inn.style.transform=`translateY(${(HGT/2)-(IH/2)-hi*IH}px)`;
      setTimeout(()=>{
        if(drag)return;
        inn.style.transition='transform .4s cubic-bezier(.4,0,.2,1)';
        inn.style.transform=`translateY(${(HGT/2)-(IH/2)-lo*IH}px)`;
        setTimeout(()=>{
          if(drag)return;
          inn.style.transition='transform .4s cubic-bezier(.4,0,.2,1)';
          inn.style.transform=`translateY(${(HGT/2)-(IH/2)-idx*IH}px)`;
        },420);
      },420);
    },400);
  });
  function clamp(n){return Math.max(0,Math.min(items.length-1,n));}
  wrap.addEventListener('mousedown',e=>{e.preventDefault();drag=true;sy=e.clientY;si=idx;});
  window.addEventListener('mousemove',e=>{if(!drag)return;e.preventDefault();const ni=clamp(si+Math.round((sy-e.clientY)/IH));if(ni!==idx){idx=ni;upd(true);onChange(items[idx]);vib(16);}});
  window.addEventListener('mouseup',()=>{drag=false;});
  wrap.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;si=idx;drag=true;},{passive:true});
  wrap.addEventListener('touchmove',e=>{if(!drag)return;e.preventDefault();const ni=clamp(si+Math.round((sy-e.touches[0].clientY)/IH));if(ni!==idx){idx=ni;upd(true);onChange(items[idx]);vib(16);}},{passive:false});
  wrap.addEventListener('touchend',()=>{drag=false;});
  return wrap;
}

/* ---------- flat step list ---------- */
function buildSteps(A){
  const steps=[{id:'welcome'}];
  SECTION_META.forEach((sec,si)=>{
    if(si===0){ steps.push({id:'details'}); }
    else if(si===1){ steps.push({id:'address'}); steps.push({id:'cellgroup'}); }
    else {
      QUESTIONS.filter(q=>q.section===si).forEach(q=>{
        if(!q.showIf || q.showIf(A)) steps.push({id:'question',q});
      });
    }
  });
  steps.push({id:'review'});
  steps.push({id:'thanks'});
  return steps;
}

}

function sectionProgress(sectionIdx){
  const steps=currentSteps();
  const inSection=steps.filter(s=>{
    if(s.id==='details') return sectionIdx===0;
    if(s.id==='address'||s.id==='cellgroup') return sectionIdx===1;
    if(s.id==='question') return s.q.section===sectionIdx;
    return false;
  });
  const curIdx=steps.slice(0,S.stepIdx+1).filter(s=>inSection.includes(s)).length;
  return {pct:Math.round((curIdx/inSection.length)*100), label:curIdx+' of '+inSection.length};
}

        };
        S.addrResults=[]; S.addrQuery=r.display_name;

      if(!(m.suburb&&m.suburb.trim())) return failValidation('Please enter your suburb.');
      if(!(m.city&&m.city.trim())) return failValidation('Please enter your city or town.');
      A.address_confirmed={
        formatted_address:[m.street,m.suburb,m.city,m.province].filter(Boolean).join(', '),
        street:m.street||'', suburb:m.suburb||'', city:m.city||'', province:m.province||'', postal_code:m.postal_code||'',
        latitude:null, longitude:null
      };
      vib(28); goNext(); return;
    }
    if(!A.address_confirmed) return failValidation('Please select your address from the list, or enter it manually below.');
    vib(28); goNext();
  });

  const kids=[
    h('div',{'class':'q-label'},sec.title),
    h('h2',{},'Residential address'),
    h('p',{'class':'subtitle'},'Select your address from the list below.'),

  ];

    kids.push(h('div',{'class':'addr-confirmed'},svgCircleCheck(),h('span',{},A.address_confirmed.formatted_address)));

    kids.push(manualLink);
  } else {

function renderQuestion(q){
  const sec=SECTION_META[q.section];
  const kids=[h('div',{'class':'q-label'},sec.title), h('h2',{},q.label)];
  if(q.hint) kids.push(h('p',{'class':'subtitle'},q.hint));
  let hasAnswer=true;

  if(q.type==='rating'){
    kids.push(h('p',{'class':'subtitle'},'Tap to select'));
    kids.push(h('div',{'class':'rating-cards'},...q.options.map(label=>{
      const card=h('button',{'class':'rating-card'+(A[q.key]===label?' selected':'')},
        h('span',{'class':'opt-ring'},A[q.key]===label?svgCheck():''),
        h('div',{'class':'rating-label'},label));
      card.addEventListener('click',()=>{vib(22);A[q.key]=label;reselect(()=>{});});
      return card;
    })));
    hasAnswer=!!A[q.key];
  } else if(q.type==='wheel'){
    kids.push(h('p',{'class':'subtitle'},'Scroll or drag to select'));
    if(A[q.key]===undefined) A[q.key]=q.options[0];
    kids.push(makeWheel(q.options,A[q.key],v=>{A[q.key]=v;reselect(()=>{});}));
    hasAnswer=!!A[q.key];
  } else if(q.type==='select'){
    kids.push(h('div',{'class':'options'},...q.options.map(o=>{
      const sel=A[q.key]===o;
      const btn=h('button',{'class':'opt'+(sel?' selected':'')},h('span',{'class':'opt-ring'},sel?svgCheck():''),o);
      btn.addEventListener('click',()=>{vib(22);A[q.key]=o;reselect(()=>{});});
      return btn;
    })));
    hasAnswer=!!A[q.key];
  } else if(q.type==='chips'){
    kids.push(h('div',{'class':'chips'},...q.options.map(o=>{
      const sel=A[q.key]===o;
      const chip=h('button',{'class':'chip'+(sel?' selected':'')},o);
      chip.addEventListener('click',()=>{vib(22);A[q.key]=o;reselect(()=>{});});
      return chip;
    })));
    hasAnswer=!!A[q.key];
  } else if(q.type==='multichips'){
    A[q.key]=A[q.key]||[];
    kids.push(h('div',{'class':'chips'},...q.options.map(o=>{
      const sel=A[q.key].includes(o);
      const chip=h('button',{'class':'chip'+(sel?' selected':'')},o);
      chip.addEventListener('click',()=>{
        vib(22);
        if(A[q.key].includes(o)) A[q.key]=A[q.key].filter(x=>x!==o);
        else A[q.key]=[...A[q.key],o];
        reselect(()=>{});
      });
      return chip;
    })));
    hasAnswer=A[q.key].length>0;
  } else if(q.type==='text'){
    const ta=h('textarea',{rows:'4',placeholder:q.optional?'Optional':'Your answer'},A[q.key]||'');
    ta.addEventListener('input',e=>{A[q.key]=e.target.value;clearErr();});
    kids.push(ta);
    hasAnswer=q.optional||!!(A[q.key]&&A[q.key].trim());
  }

  if(q.conditional && q.conditional.showIf(A)){
    const c=q.conditional;
    kids.push(h('p',{'style':'font-size:13px;color:var(--muted);margin:10px 0 8px'},c.label));
    if(c.type==='text'){
      const ta=h('textarea',{rows:'3',placeholder:'Your answer'},A[c.key]||'');
      ta.addEventListener('input',e=>{A[c.key]=e.target.value;clearErr();});
      kids.push(ta);
    } else if(c.type==='wheel'){
      if(A[c.key]===undefined) A[c.key]=c.options[0];
      kids.push(makeWheel(c.options,A[c.key],v=>{A[c.key]=v;clearErr();}));
    }
  }

  let extraOk=true;
  if(q.extra){
    const ex=q.extra;
    kids.push(h('p',{'style':'font-size:13px;color:var(--muted);margin:10px 0 8px'},ex.label));
    A[ex.key]=A[ex.key]||null;
    kids.push(h('div',{'class':'chips'},...ex.options.map(o=>{
      const sel=A[ex.key]===o;
      const chip=h('button',{'class':'chip'+(sel?' selected':'')},o);
      chip.addEventListener('click',()=>{vib(22);A[ex.key]=o;reselect(()=>{});});
      return chip;
    })));
    extraOk=!!A[ex.key];
  }

  const needsPrivacy=q.sensitive && !P[q.key];
  if(q.sensitive){
    if(q.privacyNote && q.privacyNote.showIf(A)){
      kids.push(h('p',{'class':'subtitle','style':'margin:10px 0 0'},q.privacyNote.text));
    }
    kids.push(privacyRow(q.key));
  }

  const nextBtn=h('button',{'class':'btn-primary'},'Next');
  nextBtn.addEventListener('click',()=>{
    if(!hasAnswer) return failValidation('Please answer this question before continuing.');
    if(!extraOk) return failValidation('Please answer both parts before continuing.');
    if(needsPrivacy) return failValidation('Please choose whether to include your name or keep this answer anonymous.');
    vib(28); goNext();
  });
  kids.push(h('div',{'class':'nav-row'},
    h('button',{'class':'btn-secondary',onClick:goBack},'Back'),
    nextBtn
  ));

  return screenWrap(kids,sec.color,sectionProgress(q.section));
}

function buildPayload(){
  const respondent={
    first_name:A.first_name||null, surname:A.surname||null, gender:A.gender||null,
    date_of_birth: A.dob_year&&A.dob_month&&A.dob_day ? (A.dob_year+'-'+String(['January','February','March','April','May','June','July','August','September','October','November','December'].indexOf(A.dob_month)+1).padStart(2,'0')+'-'+String(A.dob_day).padStart(2,'0')) : null,
    phone:A.phone||null,
    formatted_address: A.address_confirmed?A.address_confirmed.formatted_address:null,
    street: A.address_confirmed?(A.address_confirmed.street||null):null,
    suburb: A.address_confirmed?A.address_confirmed.suburb:null,
    city: A.address_confirmed?A.address_confirmed.city:null,
    province: A.address_confirmed?A.address_confirmed.province:null,
    postal_code: A.address_confirmed?A.address_confirmed.postal_code:null,
    latitude: A.address_confirmed?A.address_confirmed.latitude:null,
    longitude: A.address_confirmed?A.address_confirmed.longitude:null,
    knows_cell_group: A.knows_cell_group!==undefined?A.knows_cell_group:null,
    stated_cell_group: A.stated_cell_group||null,
    submitted_at:new Date().toISOString(),
    device:/mobile|android|iphone|ipad/i.test(navigator.userAgent)?'mobile':'desktop'
  };
  const identifiedAnswers=[], anonymousAnswers=[];
  QUESTIONS.forEach(q=>{
    const val=A[q.key];
    if(val===undefined||val===null||val===''||(Array.isArray(val)&&val.length===0)) {
      if(!(q.key==='pastoral_contact'&&val)) return;
    }
    const answerStr=Array.isArray(val)?val.join(', '):String(val);
    const row={section:SECTION_META[q.section].key, question_key:q.key, answer:answerStr};
    if(q.sensitive){
      if(P[q.key]==='named') identifiedAnswers.push(row);
      else if(P[q.key]==='anon') anonymousAnswers.push(row);
    } else {
      identifiedAnswers.push(row);
    }
    if(q.conditional){
      const cval=A[q.conditional.key];
      if(cval!==undefined&&cval!==null&&cval!==''){
        const crow={section:SECTION_META[q.section].key, question_key:q.conditional.key, answer:String(cval)};
        if(q.sensitive){
          if(P[q.key]==='named') identifiedAnswers.push(crow);
          else if(P[q.key]==='anon') anonymousAnswers.push(crow);
        } else identifiedAnswers.push(crow);
      }
    }
    if(q.extra){
      const eval_=A[q.extra.key];
      if(eval_!==undefined&&eval_!==null&&eval_!==''){
        const erow={section:SECTION_META[q.section].key, question_key:q.extra.key, answer:String(eval_)};
        if(q.sensitive){
          if(P[q.key]==='named') identifiedAnswers.push(erow);
          else if(P[q.key]==='anon') anonymousAnswers.push(erow);
        } else identifiedAnswers.push(erow);
      }
    }
  });
  let followUp=null;
  if(A.pastoral_contact==='Yes, please contact me'){
    followUp={topic:'Pastoral care follow-up'};
  }
  return {respondent, identifiedAnswers, anonymousAnswers, followUp};
}

    });

}

const LIVE_LAUNCH_CUTOFF='2026-08-30T00:00:00+02:00'; // survey link went out Sat 30 Aug 2026; earlier entries are pre-launch test data

function deriveVisibleAdminData(){
  if(!S.rawData) return null;
  if(S.showPreLaunch) return S.rawData;
  const cutoff=new Date(LIVE_LAUNCH_CUTOFF).getTime();
  const hiddenIds=new Set(S.rawData.hiddenRespondentIds||[]);
  const forceVisibleIds=new Set(S.rawData.forceVisibleRespondentIds||[]);
  const respondents=(S.rawData.respondents||[]).filter(r=>{
    if(forceVisibleIds.has(r.id)) return true;
    if(hiddenIds.has(r.id)) return false;
    return !r.submitted_at||new Date(r.submitted_at).getTime()>=cutoff;
  });
  const keepIds=new Set(respondents.map(r=>r.id));
  const identifiedAnswers=(S.rawData.identifiedAnswers||[]).filter(a=>keepIds.has(a.respondent_id));
  const anonymousAnswers=(S.rawData.anonymousAnswers||[]).filter(a=>!a.created_at||new Date(a.created_at).getTime()>=cutoff);
  const followUpRequests=(S.rawData.followUpRequests||[]).filter(f=>keepIds.has(f.respondent_id));
  const cellGroupAllocations=(S.rawData.cellGroupAllocations||[]).filter(a=>keepIds.has(a.respondent_id));
  return {...S.rawData, respondents, identifiedAnswers, anonymousAnswers, followUpRequests, cellGroupAllocations};
}

async function loadAdminData(){
  S.loadingData=true; render();
  try{
    const res=await fetch('/.netlify/functions/getresponses');
    S.rawData=await res.json();
  }catch(e){ S.rawData={respondents:[],identifiedAnswers:[],anonymousAnswers:[],followUpRequests:[]}; }
  S.data=deriveVisibleAdminData();
  if(S.data.cellGroupSettings && S.data.cellGroupSettings.length){
    S.cgGroupNames=S.data.cellGroupSettings.slice();
    S.cgGroupCount=S.cgGroupNames.length;
  } else if(!S.cgGroupNames.length){
    S.cgGroupNames=Array.from({length:S.cgGroupCount},(_,i)=>'Cell Group '+String.fromCharCode(65+i));
  }
  S.cgAllocations={};
  (S.data.cellGroupAllocations||[]).forEach(a=>{ S.cgAllocations[a.respondent_id]=a.group_name; });
  S.loadingData=false; render();
}

function renderAdminDash(){

    const hiddenCount=(S.rawData.respondents||[]).filter(r=>!forceVisibleIdsHdr.has(r.id)&&((r.submitted_at&&new Date(r.submitted_at).getTime()<cutoffMs)||hiddenIds.has(r.id))).length;

function allAnswersFor(key){

function warmCool(t){
  const cool=[0,178,166], warm=[224,86,86];
  const c=cool.map((v,i)=>Math.round(v+(warm[i]-v)*t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function barChart(title,options,counts,sentiment){
  const max=Math.max(1,...counts);
  return h('div',{'class':'chart-card'},
    h('div',{'class':'chart-title'},title),
    h('div',{'class':'bar-wrap'},...options.map((o,i)=>{
      const fillStyle = sentiment
        ? `width:${(counts[i]/max)*100}%;background:${warmCool(options.length>1?i/(options.length-1):0)}`
        : `width:${(counts[i]/max)*100}%;background:linear-gradient(90deg,#007a8a,#00d4ff)`;
      return h('div',{'class':'bar-row'},
        h('div',{'class':'bar-label'},o),
        h('div',{'class':'bar-track'},h('div',{'class':'bar-fill','style':fillStyle})),
        h('div',{'class':'bar-count'},counts[i])
      );
    }))
  );
}

/* ---- Cell Group Allocation (AI-assisted geographic clustering) ---- */
function kmeansCluster(points, k, iterations){
  if(!points.length) return {};
  iterations = iterations || 12;
  // Deterministic farthest-point seeding (no randomness): start from the
  // westmost point, then repeatedly add whichever remaining point is
  // farthest from the centroids chosen so far. Same input -> same output.
  const sorted = points.slice().sort((a,b)=> a.lng-b.lng || a.lat-b.lat);
  let centroids = [{lat:sorted[0].lat, lng:sorted[0].lng}];
  while(centroids.length < k && centroids.length < sorted.length){
    let best=null, bestDist=-1;
    sorted.forEach(p=>{
      let minDist=Infinity;
      centroids.forEach(c=>{
        const d=(p.lat-c.lat)*(p.lat-c.lat)+(p.lng-c.lng)*(p.lng-c.lng);
        if(d<minDist) minDist=d;
      });
      if(minDist>bestDist){ bestDist=minDist; best=p; }
    });
    centroids.push({lat:best.lat, lng:best.lng});
  }
  while(centroids.length < k) centroids.push(centroids[centroids.length-1]);
  let assignments = {};
  for(let iter=0; iter<iterations; iter++){
    assignments = {};
    points.forEach(p=>{
      let best=0, bestDist=Infinity;
      centroids.forEach((c,ci)=>{
        const d=(p.lat-c.lat)*(p.lat-c.lat)+(p.lng-c.lng)*(p.lng-c.lng);
        if(d<bestDist){ bestDist=d; best=ci; }
      });
      assignments[p.id]=best;
    });
    const sums=centroids.map(()=>({lat:0,lng:0,n:0}));
    points.forEach(p=>{ const ci=assignments[p.id]; sums[ci].lat+=p.lat; sums[ci].lng+=p.lng; sums[ci].n++; });
    centroids = centroids.map((c,i)=> sums[i].n>0 ? {lat:sums[i].lat/sums[i].n, lng:sums[i].lng/sums[i].n} : c);
  }
  return assignments;
}

function runAiAllocation(){
  const n=S.cgGroupNames.length;
  const withCoords = S.data.respondents.filter(r=>r.latitude!=null && r.longitude!=null);
  const points = withCoords.map(r=>({id:r.id, lat:parseFloat(r.latitude), lng:parseFloat(r.longitude)}));
  const assignments = kmeansCluster(points, Math.min(n, Math.max(1,points.length)));
  points.forEach(p=>{
    const clusterIdx = assignments[p.id];
    S.cgAllocations[p.id]=S.cgGroupNames[clusterIdx];
    S.cgMethod=S.cgMethod||{}; S.cgMethod[p.id]='location';
  });
  vib([50,30,50]);
  render();
}

      await loadAdminData();
    } else { S.deleteError='Delete failed'; render(); }
  }catch(e){ S.deleting=false; S.deleteError='Delete failed: '+e.message; render(); }
}

async function exportPptx(){
  if(!window._pptxReady || !window.PptxGenJS){ alert('Export library still loading, please try again in a moment.'); return; }
  const pptx=new window.PptxGenJS();
  const title=pptx.addSlide();
  title.addText('Othandweni Branch Survey',{x:0.5,y:1.8,w:9,h:1,fontSize:32,bold:true,color:'0d1426'});
  title.addText('Response Insights',{x:0.5,y:2.6,w:9,h:0.6,fontSize:16,color:'007a8a'});

  const summary=pptx.addSlide();
  summary.addText('Summary',{x:0.5,y:0.3,w:9,h:0.5,fontSize:22,bold:true});
  summary.addText(
    'Total Respondents: '+S.data.respondents.length+'\n'+
    'Named Answers: '+(S.data.identifiedAnswers||[]).length+'\n'+
    'Anonymous Answers: '+(S.data.anonymousAnswers||[]).length,
    {x:0.5,y:1,w:9,h:1.5,fontSize:14}
  );

  QUESTIONS.filter(q=>['select','chips','multichips','rating','wheel'].includes(q.type)).forEach(q=>{
    const answers=allAnswersFor(q.key);
    if(!answers.length) return;
    const counts=q.options.map(o=>answers.filter(a=>a.split(', ').includes(o)).length);
    const slide=pptx.addSlide();
    slide.addText(q.label,{x:0.5,y:0.3,w:9,h:0.6,fontSize:16,bold:true});
    slide.addChart(pptx.ChartType.bar,[{name:q.label,labels:q.options,values:counts}],{x:0.5,y:1,w:9,h:4.5,barDir:'bar'});
  });

  await pptx.writeFile({fileName:'Othandweni-Branch-Survey-Insights.pptx'});
}

function exportExcel(){
  if(!window._xlsxReady || !window.XLSX){ alert('Export library still loading, please try again in a moment.'); return; }
  const wb=window.XLSX.utils.book_new();

  const respRows=S.data.respondents.map(r=>({
    'First Name':r.first_name,'Surname':r.surname,'Gender':r.gender,
    'Date of Birth':r.date_of_birth?String(r.date_of_birth).slice(0,10):'',
    'Phone':r.phone,'Suburb':r.suburb,'City':r.city,'Province':r.province,
    'Knows Cell Group':r.knows_cell_group===true?'Yes':r.knows_cell_group===false?'No':'',
    'Stated Cell Group':r.stated_cell_group||'',
    'Submitted At':r.submitted_at?new Date(r.submitted_at).toLocaleString():''
  }));
  window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.json_to_sheet(respRows), 'Respondents');

  const idRows=(S.data.identifiedAnswers||[]).map(a=>({Section:a.section,Question:a.question_key,Answer:a.answer}));
  window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.json_to_sheet(idRows), 'Named Answers');

  const anonRows=(S.data.anonymousAnswers||[]).map(a=>({Section:a.section,Question:a.question_key,Answer:a.answer}));
  window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.json_to_sheet(anonRows), 'Anonymous Answers');

  const summaryRows=[];
  QUESTIONS.filter(q=>['select','chips','multichips','rating','wheel'].includes(q.type)).forEach(q=>{
    const answers=allAnswersFor(q.key);
    if(!answers.length) return;
    q.options.forEach(o=>{
      summaryRows.push({Question:q.label,Option:o,Count:answers.filter(a=>a.split(', ').includes(o)).length});
    });
  });
  window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.json_to_sheet(summaryRows), 'Summary');

  window.XLSX.writeFile(wb, 'Othandweni-Branch-Survey-Insights.xlsx');
}

render();
</script>
